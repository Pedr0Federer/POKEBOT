name: KSP Pokemon Bot Service

on:
  schedule:
    - cron: '*/15 * * * *' # יריץ את הבוט אוטומטית כל 15 דקות
  workflow_dispatch: # מאפשר לך גם להפעיל את הסורק ידנית בלחיצת כפתור

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4

    - name: Run KSP Scraper
      run: python ksp_pokemon_bot.py

    - name: Save and Commit Updated State
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add ksp_state.json
        git commit -m "Update KSP state [skip ci]" || echo "No changes to commit"
        git push
